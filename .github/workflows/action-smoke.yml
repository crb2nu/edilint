name: action-smoke

# The two proof jobs build edilint from the checkout (`version: source`), so
# they prove the composite steps and the current code on every push and pull
# request. The `released` job installs the release named by the pushed ref
# (`github.ref_name`), because under `uses: ./` the action ref
# is empty and the action has no default version to fall back to. That tag can
# only resolve once it exists, so the job runs on tag pushes and on demand.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          files: examples/remittance.x12
          version: source

  defect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        id: lint
        continue-on-error: true
        with:
          files: examples/shortcount.x12
          version: source
      - name: Require lint failure
        if: steps.lint.outcome != 'failure' || steps.lint.outputs.exit-code != '1'
        run: |
          echo "Expected edilint to exit 1 on examples/shortcount.x12"
          exit 1

  released:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          files: examples/remittance.x12
          version: ${{ github.ref_name }}
