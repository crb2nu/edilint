name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

# Serialize versions as well as retries so concurrent tags cannot race latest.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  guard:
    name: verified release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: require main ancestry, version notes, and successful main CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          go run ./internal/releasecheck tag --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --main "refs/remotes/origin/${DEFAULT_BRANCH}"
          go run ./internal/releasecheck ci --repo "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --branch "$DEFAULT_BRANCH"

  # Repeat the same quality and package checks with current vulnerability data.
  # This reusable workflow has no publication credentials or write permissions.
  quality:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [guard, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: recheck the tag and CI before publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          go run ./internal/releasecheck tag --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --main "refs/remotes/origin/${DEFAULT_BRANCH}" --notes "$RUNNER_TEMP/release-notes.md"
          go run ./internal/releasecheck ci --repo "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --branch "$DEFAULT_BRANCH"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean --parallelism=2 --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
