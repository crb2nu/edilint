name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser derives the version and changelog boundaries from tags,
          # which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # arm64 images are built under emulation; the binary itself is
      # cross-compiled by Go, so QEMU only runs the image assembly.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained token with write access to crb2nu/homebrew-tap.
          # When the secret is not configured this is the empty string and the
          # brew formula upload is skipped, not failed; see .goreleaser.yml.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
