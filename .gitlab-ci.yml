# GitLab CI — gitlab.flexinfer.ai/libs/edilint is the canonical repository;
# github.com/crb2nu/edilint is a push mirror of main and tags (see mirror:github).
#
# The GitHub Actions workflow (.github/workflows/ci.yml) keeps running on the
# mirror and supplies what these runners cannot: the macOS and Windows test
# matrix, packaged-binary smoke tests, and GoReleaser rehearsal. Everything in
# `make ci` runs here, on every MR, using the same pinned golangci-lint version
# the Makefile does so lint results cannot disagree between laptop and CI.
include:
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'
  - project: 'services/tech-radar'
    file: '/ci/radar.yml'

stages: [lint, test, build, mirror]

variables:
  GOPROXY: "https://proxy.golang.org,direct"
  # Go jobs here do not use Docker-in-Docker; disable the runner's daemon wait.
  DOCKER_HOST: ""
  DOCKERHUB_CACHE_PREFIX: "registry.harbor.lan/dockerhub-cache"

# Keep aligned with .go-version; Go 1.23 below is compatibility only.
.go-base:
  image: registry.harbor.lan/dockerhub-cache/library/golang:1.26.8

# The shared .go-lint template installs its own golangci-lint version. This
# repo pins the version in the Makefile so `make lint` and CI are identical;
# reuse the template's cache and checkout handling but run the Makefile target.
lint:
  extends: .go-base
  stage: lint
  interruptible: true
  variables:
    CGO_ENABLED: "0"
  script:
    - make fmt-check
    - make docs-check
    - make vet
    - make lint
    - make workflow-check

test:
  extends: .go-base
  stage: test
  interruptible: true
  variables:
    # The race detector needs cgo.
    CGO_ENABLED: "1"
  script:
    - make test-race

# Every parser gets ten seconds with two workers. Retain minimized failures so
# they can be reproduced and committed as regression seeds.
fuzz:
  extends: .go-base
  stage: test
  interruptible: true
  timeout: 10m
  variables:
    CGO_ENABLED: "1"
  script:
    - make fuzz
  artifacts:
    when: on_failure
    paths: [testdata/fuzz/]
    expire_in: 1 week

benchmark:
  extends: .go-base
  stage: test
  interruptible: true
  timeout: 10m
  script:
    - make bench > benchmark.txt
    - cat benchmark.txt
  artifacts:
    when: always
    paths: [benchmark.txt]
    expire_in: 1 month

# go.mod claims a Go 1.23 floor for locked-down healthcare toolchains.
# GOTOOLCHAIN=local turns any accidental upward drift into a hard failure.
minimum-go:
  extends: .go-base
  stage: test
  interruptible: true
  image: registry.harbor.lan/dockerhub-cache/library/golang:1.23
  variables:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
  script:
    - go build ./...
    - go test ./...

build:
  extends: .go-base
  stage: build
  interruptible: true
  variables:
    CGO_ENABLED: "0"
  script:
    - go build -o bin/edilint ./cmd/edilint
    - ./bin/edilint --version
    - ./bin/edilint examples/remittance.x12 || test $? -eq 1
  artifacts:
    paths: [bin/edilint]
    expire_in: 1 week

# Scan with a current patched toolchain; minimum-go remains a compatibility check.
vulnerability:
  extends: .go-base
  stage: test
  interruptible: true
  timeout: 10m
  script:
    - make vuln

# Tags must identify clean commits already merged to main, with authored notes.
release-tag:
  extends: .go-base
  stage: lint
  interruptible: false
  script:
    - git fetch origin "${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - go run ./internal/releasecheck tag --tag "$CI_COMMIT_TAG" --sha "$CI_COMMIT_SHA" --main "refs/remotes/origin/${CI_DEFAULT_BRANCH}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# Main and release tags have separate pushes. A tag job never updates main,
# and a main job cannot accidentally publish unvalidated tags.
mirror:github:
  stage: mirror
  image: ${DOCKERHUB_CACHE_PREFIX}/alpine/git:latest
  resource_group: github-mirror
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - sh scripts/mirror-github.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v/'

radar-scan:
  extends: .radar-scan
