name: edilint
description: Lint EDI files and report findings as GitHub workflow annotations.
branding:
  icon: check-circle
  color: blue
inputs:
  files:
    description: Space-separated file paths or globs to lint.
    required: true
  format:
    description: Output format for findings.
    default: github
  baseline:
    description: Optional baseline file passed to --baseline.
    required: false
  version:
    description: >-
      Release tag of edilint to install, or `source` to build edilint from this
      action's own checkout (the ref the workflow pinned). When empty, installs
      the ref named in the `uses:` line (`crb2nu/edilint@v0.7.0` installs
      v0.7.0); under `uses: ./` that ref is empty, so set `version` explicitly.
    required: false
    default: ''
outputs:
  exit-code:
    description: Exit status of edilint (0 clean, 1 findings, 2 usage or read error).
    value: ${{ steps.lint.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: stable
    - name: Install edilint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        # An empty version installs the ref this action was pinned to.
        VERSION="${VERSION:-$ACTION_REF}"
        if [[ -z "$VERSION" ]]; then
          echo '::error::edilint: set the `version` input to a release tag or `source`; the action ref is empty (for example under `uses: ./`), so there is no tag to fall back to.'
          exit 2
        fi
        if [[ "$VERSION" == "source" ]]; then
          # Build from the checkout this action runs from: the repository itself
          # under `uses: ./`, or the pinned ref under `uses: crb2nu/edilint@<ref>`.
          # This never consults the module proxy, so it works before a release
          # tag exists and for refs that are not releases.
          bin="$RUNNER_TEMP/edilint-source-bin"
          mkdir -p "$bin"
          (cd "$ACTION_PATH" && go build -o "$bin/edilint" ./cmd/edilint)
          echo "$bin" >> "$GITHUB_PATH"
        else
          go install "github.com/crb2nu/edilint/cmd/edilint@${VERSION}"
        fi
    - name: Lint files
      id: lint
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        FORMAT: ${{ inputs.format }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        args=(--output "$FORMAT")
        if [[ -n "$BASELINE" ]]; then
          args+=(--baseline "$BASELINE")
        fi
        # Split paths on whitespace and expand globs intentionally.
        # shellcheck disable=SC2206
        args+=($FILES)
        set +e
        edilint "${args[@]}"
        rc=$?
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        exit "$rc"
