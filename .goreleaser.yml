# goreleaser configuration. A push of a v* tag runs this via
# .github/workflows/release.yml after exact-commit CI and release checks.
# CI rehearses all seven archives (six CLI targets and the browser module)
# and executes the native packaged binaries.
version: 2

project_name: edilint

builds:
  - id: cli
    main: ./cmd/edilint
    binary: edilint
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducible timestamps: the same tag builds the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The browser build (cmd/edilint-wasm) so a web page can lint files locally
  # from a release instead of a checkout; `make wasm` produces the same module.
  # The Go runtime's JavaScript shim is copied beside it after the build.
  - id: wasm
    main: ./cmd/edilint-wasm
    binary: edilint
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - js
    goarch:
      - wasm
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - sh -c 'cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "{{ dir .Path }}/wasm_exec.js"'

archives:
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

  # edilint_<version>_wasm.tar.gz: edilint.wasm, wasm_exec.js, LICENSE, and
  # the sample fixtures the browser playground offers, so a downstream site
  # can track a release without this repository checked out.
  - id: wasm
    ids: [wasm]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_wasm"
    files:
      - LICENSE
      # goreleaser builds into dist/<build id>_<os>_<arch>/; the post hook
      # above copies the shim there.
      - src: dist/wasm_js_wasm/wasm_exec.js
        strip_parent: true
      - testdata/835_clean.x12
      - testdata/835_charset.x12
      - testdata/835_envelope_broken.x12
      - testdata/837p_claims_mixed_term.x12
      - testdata/hl7v2_dirty.hl7
      - testdata/hl7v2_batch_broken.hl7
      - testdata/edifact_broken.edi
      - testdata/bom_mixed.csv

checksum:
  name_template: checksums.txt

# CHANGELOG.md is written by hand; a commit-log changelog would duplicate it
# with worse prose.
changelog:
  disable: true

release:
  footer: |
    See [CHANGELOG.md](https://github.com/crb2nu/edilint/blob/main/CHANGELOG.md)
    for the authored changelog.

# Homebrew ships CLI binaries from a tap as a cask. `brew install
# crb2nu/tap/edilint` resolves it the same way it resolved the old formula
# form, which goreleaser has deprecated.
homebrew_casks:
  - name: edilint
    binaries:
      - edilint
    repository:
      owner: crb2nu
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/crb2nu/edilint
    description: Pre-send linter for healthcare interchange files
    # The workflow always sets TAP_GITHUB_TOKEN, possibly to the empty string
    # when the secret is not configured yet. Skipping then keeps a release
    # publishable before the tap exists, rather than failing halfway.
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    # The binaries are not signed or notarized, so Gatekeeper would quarantine
    # them on download. Dropping the quarantine attribute at install time is
    # goreleaser's documented approach until signing is worth its cost.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/edilint"]
          end

# The image is built from scratch: a static binary and nothing else. edilint
# makes no network calls, so it needs no CA bundle, no shell and no libc, and
# an empty base keeps that verifiable. dockers_v2 builds one multi-platform
# manifest in a single buildx step.
dockers_v2:
  - dockerfile: Dockerfile
    images:
      - ghcr.io/crb2nu/edilint
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: edilint
      org.opencontainers.image.description: Pre-send linter for healthcare interchange files
      org.opencontainers.image.source: https://github.com/crb2nu/edilint
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
